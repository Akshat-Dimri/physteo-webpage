      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

    <title>Physteo - NIT Hamirpur</title>
    <style>
      /* --- CORE VARIABLES --- */
      :root {
        --bg-body: #000000;
        --dot-color: #000000;
        --container-bg: rgba(0, 0, 0, 0.92);
        --text-color: #ffffff;
        --border-color: #ffffff;
        --accent-color: #000000;

        --font-main: "Helvetica", "Arial", sans-serif;
        --font-mono: "Courier New", Courier, monospace;
        --contact-accent: #008000;
      }

      /* --- INVERTED MODE --- */
      body.inverted {
        --bg-body: #ffffff;
        --dot-color: #000000;
        --container-bg: rgba(255, 255, 255, 0.92);
        --text-color: #000000;
        --border-color: #000000;
        --accent-color: #000000;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-body);
        transition: background-color 0.5s ease;
        /* background-image: radial-gradient(circle, var(--dot-color) 85%, transparent 86%);
            background-size: 4px 4px; */
        color: var(--text-color);
        font-family: var(--font-main);
        line-height: 1.5;
        overflow-x: hidden;
        transition: background-color 0.5s ease;
        width: 100%;
      }

      #dot-canvas {
        position: fixed;
        inset: 0;
        z-index: 9998; /* below preloader (9999) */
        pointer-events: none;
        background: transparent;
      }

      /* === LOCATION IMAGE BOX === */

      .location-box {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        overflow: hidden;
      }

      .location-box img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* fills box on desktop */
        object-position: center;
        z-index: 1;
      }

      /* Default (dark / blue / green) */
      .location-box img {
        content: url("./images/location_pin.png");
      }

      /* Light (inverted) mode */
      body.inverted .location-box img {
        content: url("./images/location_pin_light.png");
      }

      /* Overlay content */
      /* === LOCATION LABEL BOX (TOP-LEFT, OPAQUE) === */

      .location-label {
        position: absolute;
        top: 16px;
        left: 16px;

        background: #000000; /* fully opaque */
        border: 1px solid #ffffff;

        padding: 10px 14px;
        z-index: 3;

        font-family: var(--font-mono);
        text-align: left;
      }

      .location-label span {
        display: block;
        font-size: 0.7rem;
        opacity: 0.9;
        color: #ffffff;
      }

      .location-label h3 {
        margin-top: 4px;
        font-size: 0.95rem;
        color: #ffffff;
      }

      /* Mobile: keep proportions */
      @media (max-width: 768px) {
        .location-box {
          aspect-ratio: 16 / 9;
        }
      }

      /* --- ARTIFACT IMAGE STYLING --- */
      .artifact-frame {
        position: relative;
        border: 1px solid var(--border-color);
        background: #000;
        overflow: hidden;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.03),
            rgba(0, 255, 0, 0.01),
            rgba(0, 0, 255, 0.03)
          );
        background-size:
          100% 3px,
          3px 100%;
      }

      /* === EVENT SVG ANIMATION (SCOPED) === */

      .event-animation {
        position: relative;
        width: 100%;
        height: 100%;
        aspect-ratio: 1 / 1; /* keeps square */
        overflow: hidden;
      }

      .event-animation::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("./images/singularity_webpage_black.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .event-animation svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .event-card .artifact-frame {
        width: 100%;
        height: 140px;
        margin-bottom: 15px;
      }


      /* SCALED UP: Increased width to 150px and height to 200px */
      .team-card .artifact-frame {
        width: 200px;
        height: 250px;
        flex-shrink: 0;
      }

      .data-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        filter: grayscale(1) contrast(1.2) brightness(0.7);
        opacity: 0.6;
        transition:
          filter 0.4s ease,
          opacity 0.4s ease,
          transform 0.8s ease;
      }

      .content-panel:hover .data-img {
        filter: grayscale(0.4) contrast(1) brightness(0.9);
        opacity: 0.9;
        transform: scale(1.03);
      }

      body.inverted .artifact-frame {
        background: #fff;
      }
      body.inverted .data-img {
        filter: grayscale(1) contrast(1.2) brightness(0.7);
        opacity: 0.6;
      }



      /* --- PRELOADER STYLES --- */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        z-index: 9999;
        font-family: var(--font-mono);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px;
        transition: opacity 0.8s ease;
      }

      .terminal-logs p {
        margin-bottom: 10px;
        opacity: 0;
        animation: fadeInLog 0.5s forwards;
        font-size: 0.9rem;
      }
      .terminal-logs p:nth-child(1) {
        animation-delay: 0.2s;
      }
      .terminal-logs p:nth-child(2) {
        animation-delay: 1s;
      }
      .terminal-logs p:nth-child(3) {
        animation-delay: 1.8s;
      }
      .terminal-logs p:nth-child(4) {
        animation-delay: 2.6s;
      }

      .loading-bar {
        font-size: 1rem;
        opacity: 0.8;
        word-break: break-all;
      }

      @keyframes fadeInLog {
        to {
          opacity: 1;
        }
      }

      /* --- SYSTEM STATUS EFFECTS --- */
      .system-status {
        font-family: var(--font-mono);
        margin-bottom: 20px;
        color: #008000;
        animation: slowBlink 3s infinite;
      }

      @keyframes slowBlink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* --- GLOBAL LAYOUT --- */
      .grid-container {
        max-width: 1400px;
        margin: 0 auto;
        border-left: 1px solid var(--border-color);
        border-right: 1px solid var(--border-color);
        background-color: var(--container-bg);
        backdrop-filter: blur(2px);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        opacity: 0;
        transition:
          opacity 1s ease,
          background-color 0.5s ease,
          border-color 0.5s ease,
          color 0.5s ease,
          text-shadow 0.2s ease,
          transform 0.2s ease;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 70px;
        border-bottom: 1px solid var(--border-color);
        background: var(--accent-color);
        position: relative;
        z-index: 10;
        transition: background 0.5s ease;
      }

      body:not(.inverted) header {
        color: white;
      }
      body.inverted header {
        background: #ffffff;
        border-bottom: 1px solid #000;
      }
      body.inverted header .logo,
      body.inverted nav button {
        color: #000;
      }

      /* === CLEAN COMMENT-BULLET TYPOGRAPHY === */

      .about-manifest p {
        white-space: normal;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        line-height: 1.6;
        margin-top: 20px;
        opacity: 0.9;
        max-width: 90%;
      }

      .about-manifest p span.comment {
        display: block;
        position: relative;
        padding-left: 1.8em; /* space for // */
        margin-bottom: 0.6em;
      }

      .about-manifest p span.comment::before {
        content: "//";
        position: absolute;
        left: 0;
        opacity: 0.6;
      }

      /* --- TERMINAL COLOR MODES --- */
      body.theme-blue {
        --bg-body: #020617; /* deep navy */
        --dot-color: #020617;
        --container-bg: rgba(2, 6, 23, 0.92);
        --text-color: #60a5fa; /* terminal blue */
        --border-color: #3b82f6;
        --accent-color: #020617;
      }

      body.theme-green {
        --bg-body: #020c07; /* dark phosphor green */
        --dot-color: #020c07;
        --container-bg: rgba(2, 12, 7, 0.92);
        --text-color: #22c55e; /* terminal green */
        --border-color: #16a34a;
        --accent-color: #020c07;
      }

      .logo {
        padding: 0 20px;
        font-size: 1.2rem;
        font-weight: bold;
        letter-spacing: 1px;
        height: 70px;
        display: flex;
        align-items: center;
        border-right: 1px solid var(--border-color);
        cursor: pointer;
      }

      nav ul {
        display: flex;
        list-style: none;
        height: 70px;
      }
      nav li {
        height: 100%;
        border-left: 1px solid var(--border-color);
      }

      nav button {
        background: none;
        border: none;
        color: var(--text-color);
        padding: 0 25px;
        height: 100%;
        display: flex;
        align-items: center;
        font-family: var(--font-mono);
        text-transform: uppercase;
        font-size: 0.85rem;
        cursor: pointer;
        transition:
          background 0.3s,
          color 0.3s;
      }

      nav button:hover {
        background: var(--border-color);
        color: var(--accent-color);
      }

      #dynamic-view {
        flex: 1;
        display: grid;
        transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        border-bottom: 1px solid var(--border-color);
        position: relative;
        height: calc(100vh - 70px - 40px);
        overflow: hidden;
      }

      #dynamic-view.view-home {
        grid-template-columns: 3fr 1fr;
      }
      #dynamic-view.view-events {
        grid-template-columns: 1fr 1fr 1fr;
      }
      #dynamic-view.view-team {
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: auto;
      }

      /* --- ABOUT MODULE --- */
      #dynamic-view.view-about {
        grid-template-columns: 1.5fr 1fr;
      }

      .about-manifest h1 {
        font-size: 3.2rem;
        line-height: 1.05;
        letter-spacing: -1px;
      }

      #dynamic-view.view-archive {
        grid-template-columns: 1fr;
      }

      #dynamic-view.view-archive .archive-panel {
        height: 100%;
        padding: 0;
        overflow: hidden;
        position: relative;
      }

      /* to create the visual 90% height safely for visual consistency */
      .archive-stage {
        position: absolute;
        inset: 0;
      }

      /* Canvas fills usable space */
      .archive-stage canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .system-manifest {
        font-family: var(--font-mono);
        font-size: 0.8rem;
      }

      .manifest-entry {
        padding: 12px 0;
        border-bottom: 1px dashed var(--border-color);
      }

      .manifest-label {
        opacity: 0.4;
        text-transform: uppercase;
      }

      .manifest-value {
        font-size: 0.9rem;
        letter-spacing: 0.5px;
      }

      .content-panel {
        padding: 30px;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.5s ease;
        position: relative;
        min-height: 300px;
      }

      .view-events .content-panel:nth-child(3) {
        border-right: none;
      }
      .view-team .content-panel:nth-child(3n) {
        border-right: none;
      }
      .view-team .content-panel:nth-child(n + 4) {
        border-top: 1px solid var(--border-color);
      }

      .visible {
        opacity: 1;
      }

      h1,
      h2,
      h3 {
        font-family: var(--font-mono);
        text-transform: uppercase;
        font-weight: normal;
      }

      .hero-title-wrapper {
        min-height: 20rem;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
      }

      .hero-title {
        font-size: 4rem;
        line-height: 1.1;
        letter-spacing: -2px;
      }
      .big-char {
        font-size: 1.5em;
        font-weight: normal;
        color: var(--text-color);
        line-height: 1;
      }
      .small-text {
        font-size: 0.7em;
        opacity: 0.9;
      }

      .cursor {
        display: inline-block;
        background-color: var(--text-color);
        width: 5px;
        height: 1em;
        margin-left: 5px;
        animation: blink 1s infinite;
        vertical-align: baseline;
      }

      .event-card,
      .team-card {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      /* Team Card Layout */
      .team-card {
        display: flex;
        flex-direction: row;
        gap: 20px;
        align-items: flex-start;
      }

      .schrodinger-target {
        text-transform: none;
      }

      /* MATCHED HEIGHT: Text container height matches new image height (200px) */
      .team-details {
        display: flex;
        flex-direction: column;
        height: 200px; /* match image height */
        justify-content: flex-start; /* to align   ID to the top */
        flex: 1;
      }

      .team-name-group {
        margin-top: auto; /* pushing the name group to the bottom */
      }

      .team-separator {
        width: 100%;
        height: 1px;
        background-color: var(--text-color);
        opacity: 0.6;
        margin: 8px 0;
      }

      .event-number {
        font-family: var(--font-mono);
        font-size: 3rem;
        opacity: 0.2;
        margin-bottom: 20px;
      }

      .scroll-arrow {
        position: absolute;
        right: 24px;
        bottom: 24px;

        width: 50px;
        height: 50px;

        border: 1px solid var(--border-color);
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
        background: var(--accent-color);
        color: var(--text-color);

        font-family: var(--font-mono);
        font-weight: bold;

        z-index: 100;
        pointer-events: auto;

        transition: all 0.3s ease;
      }

      /* === ARCHIVE NAV PAIR === */

      .scroll-next {
        right: 24px;
      }

      .scroll-prev {
        right: 84px; /* exactly one button width + gap */
      }

      body:not(.inverted) .scroll-arrow {
        background: black;
        color: white;
        border-color: white;
      }
      body:not(.inverted) .scroll-arrow:hover {
        background: white;
        color: black;
      }
      body.inverted .scroll-arrow {
        background: white;
        color: black;
        border-color: black;
      }
      body.inverted .scroll-arrow:hover {
        background: black;
        color: white;
      }

      .date {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        opacity: 0.7;
        display: block;
      }
      .role {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        opacity: 0.8;
        display: block;
        text-transform: uppercase;
      }

      /* --- UPDATED STATUS BAR LAYOUT --- */
      .section-header {
        padding: 15px 20px;
        border-bottom: 1px solid var(--border-color);
        background: var(--accent-color);
        color: var(--text-color);
        font-family: var(--font-mono);
        font-size: 0.9rem;
        transition: all 0.3s ease;

        /* Added these lines */
        display: flex; 
        justify-content: space-between; 
        align-items: center;
      }

      .legal-link {
        font-size: 0.75rem;
        color: inherit;
        text-decoration: none;
        opacity: 0.4;
        transition: opacity 0.3s ease;
        letter-spacing: 1px;
      }

      .legal-link:hover {
        opacity: 1;
        text-decoration: underline;
      }
      body.inverted .section-header {
        background: #fff;
        color: #000;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* --- WAVE & TOOLTIP --- */
      .wave-container {
        height: 60px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden; /* retain overflow */
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
        background: var(--accent-color);
        position: relative;
        cursor: crosshair;
      }
      body.inverted .wave-container {
        background: #fff;
      }

      .wave-svg {
        width: 100%;
        height: 100%;
      }
      .wave-path {
        fill: none;
        stroke: var(--text-color);
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
      }

      .wave-tooltip {
        position: absolute;
        background: var(--container-bg);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 4px 8px;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        pointer-events: none;
        white-space: nowrap;
        display: none;
        z-index: 100;
        box-shadow: 0 0 10px rgba(125, 125, 125, 0.2);
      }
      /* config optimizatn for mobile devices, scale down file size - if req -  */
      /* retain aspect ration here - problem aayegi scaling main nahi toh */
      /* --- MOBILE OPTIMIZATIONS --- */
      @media (max-width: 768px) {
        header {
          flex-direction: column;
          height: auto;
          align-items: stretch;
        }
        .logo {
          border-right: none;
          border-bottom: 1px solid var(--border-color);
          justify-content: center;
          width: 100%;
        }
        nav ul {
          width: 100%;
          justify-content: space-around;
        }
        nav li {
          border-left: none;
          flex: 1;
        }
        nav button {
          width: 100%;
          padding: 0;
          justify-content: center;
          font-size: 0.7rem;
        }

        #dynamic-view.view-home,
        #dynamic-view.view-events,
        #dynamic-view.view-team {
          display: flex;
          flex-direction: column;
        }

        .hero-title {
          font-size: 10vw;
        }
        .hero-title-wrapper {
          height: 50vw;
          overflow: hidden;
        }

        .content-panel {
          border-right: none !important;
          border-bottom: 1px solid var(--border-color) !important;
          min-height: auto;
          padding: 40px 20px;
        }
        .scroll-arrow {
          position: fixed;
          bottom: 80px;
          right: 20px;
          width: 45px;
          height: 45px;
        }
        .wave-container {
          display: flex;
        }
        .terminal-logs {
          font-size: 0.7rem;
        }

        .scroll-next {
          right: 20px;
        }

        .scroll-prev {
          right: 70px;
        }

        #dynamic-view.view-about {
          display: flex;
          flex-direction: column;
        }

        #dynamic-view.view-about .content-panel {
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }

        #dynamic-view.view-about .content-panel:last-child {
          border-bottom: none;
        }
      }

      /* === CONTACT FIELD (SCOPED) === */

      .view-contact {
        grid-template-columns: 1fr 1.5fr;
      }

      /* === SOCIETY CONTACT HANDLES COLOR SYNC === */

      .view-contact .contact-socials a {
        color: var(--contact-accent);
      }

      .contact-details a {
        font-size: 1.3rem;
        text-decoration: none;
        color: var(--contact-accent);
      }

      .contact-socials a {
        font-size: 1.3rem;
        margin-left: 12px; /* spacing between links */
        display: inline-block;
      }

      .contact-list {
        font-family: var(--font-mono);
        font-size: 0.85rem;
      }

      .contact-section {
        margin-bottom: 30px;
      }

      .contact-section-title {
        opacity: 0.4;
        margin-bottom: 10px;
      }

      /* === CONTACT SOCIALS: VERTICAL LOCKED ALIGNMENT === */

      .contact-socials.vertical {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .contact-socials.vertical a {
        margin: 4px 0;
      }

      .contact-node {
        cursor: pointer;
        opacity: 0.7;
        padding: 4px 0;
      }

      /* === SOCIETY HANDLES: LOCKED STACKED LAYOUT === */

      .society-handles {
        font-family: var(--font-mono);
        font-size: 0.8rem;
      }

      .society-title {
        margin-bottom: 10px; /* space after colon */
      }

      .contact-socials.vertical {
        display: flex;
        flex-direction: column;
        gap: 8px; /* adjustable spacing between socials */
      }

      /* === CONTACT NODE ALIGNMENT LOCK === */

      .contact-node {
        display: grid;
        grid-template-columns: 1.2em 1fr;
        column-gap: 6px;
        align-items: start;
        line-height: 1.4;
      }

      .contact-node:hover {
        opacity: 1;
        text-decoration: underline;
      }

      .contact-details {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        white-space: pre-line;
      }

      .contact-socials a {
        margin-right: 10px;
        text-decoration: none;
        opacity: 0.7;
      }

      .contact-socials a:hover {
        opacity: 1;
        text-decoration: underline;
      }

      /* === CONTACT CLEAN WRAPPING === */

      .contact-details {
        white-space: normal;
      }

      .contact-details a,
      .contact-details div,
      .contact-details span {
        display: block;
        padding-left: 1.6em;

    <script>
      /* === DOT CANVAS SYSTEM === */

      const dotCanvas = document.getElementById("dot-canvas");
      const dotCtx = dotCanvas.getContext("2d");
      const TEAM_PAGE_SIZE = 6;

      function resizeCanvas() {
        dotCanvas.width = window.innerWidth;
        dotCanvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const { dotCanvas: dotCfg, archive } = UI_CONFIG;

      const DOT_SPACING = dotCfg.spacing;
      const DOT_SIZE = dotCfg.size;

      const dots = [];

      function createDots() {
        dots.length = 0;
        for (let y = 0; y < dotCanvas.height; y += DOT_SPACING) {
          for (let x = 0; x < dotCanvas.width; x += DOT_SPACING) {
            dots.push({
              x,
              y,
              tx: x,
              ty: y,
            });
          }
        }
      }
      createDots();

      const logoImg = new Image();
      logoImg.src = "./images/physteo-logo.png";

      let logoReady = false;
      let logoPoints = [];

      logoImg.onload = () => {
        const temp = document.createElement("canvas");
        const tctx = temp.getContext("2d");

        const SIZE = 300;
        temp.width = SIZE;
        temp.height = SIZE;

        tctx.drawImage(logoImg, 0, 0, SIZE, SIZE);
        const imgData = tctx.getImageData(0, 0, SIZE, SIZE).data;

        for (let y = 0; y < SIZE; y += 3) {
          for (let x = 0; x < SIZE; x += 3) {
            if (imgData[(y * SIZE + x) * 4 + 3] > 150) {
              logoPoints.push({
                x: x + dotCanvas.width / 2 - SIZE / 2,
                y: y + dotCanvas.height / 2 - SIZE / 2,
              });
            }
          }
        }
        logoReady = true;
      };

      function assignLogoTargets() {
        dots.forEach((d, i) => {
          const p = logoPoints[i % logoPoints.length];
          d.tx = p.x;
          d.ty = p.y;
        });
      }

      let dotAlpha = 1;
      let morphing = false;

      function animateDots() {
        dotCtx.fillStyle = "#000";
        dotCtx.fillRect(0, 0, dotCanvas.width, dotCanvas.height);
        dotCtx.globalAlpha = dotAlpha;
        dotCtx.fillStyle = "#fff";
        dots.forEach((d) => {
          d.x += (d.tx - d.x) * dotCfg.morphSpeedX;
          d.y += (d.ty - d.y) * dotCfg.morphSpeedY;
          dotCtx.fillRect(d.x, d.y, DOT_SIZE, DOT_SIZE);
        });

        if (morphing) {
          if (dotAlpha > 0.4) {
            dotAlpha -= dotCfg.fadeSlow;
          } else {
            dotAlpha -= dotCfg.fadeFast;
          }

          if (dotAlpha <= 0) {
            dotCanvas.style.display = "none";
            return;
          }
        }

        requestAnimationFrame(animateDots);
      }

      animateDots();

      let archiveDots = [];
      let archiveTargets = [];
      let archiveCanvas, archiveCtx;

      let archiveRAF;

      function startArchiveMorph(imgSrc) {
        if (archiveRAF) {
          cancelAnimationFrame(archiveRAF);
          archiveRAF = null;
        }

        archiveCanvas = document.getElementById("archive-canvas");
        if (!archiveCanvas) return;

        archiveCtx = archiveCanvas.getContext("2d");

        const rect = archiveCanvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        archiveCanvas.width = rect.width * dpr;
        archiveCanvas.height = rect.height * dpr;

        archiveCanvas.style.width = rect.width + "px";
        archiveCanvas.style.height = rect.height + "px";

        archiveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const SAMPLE_GAP = archive.sampleGap;
        const STAGE_SIZE = Math.min(rect.width, rect.height);

        function imageToPoints(img) {
          const temp = document.createElement("canvas");
          const tctx = temp.getContext("2d");

          temp.width = img.width;
          temp.height = img.height;
          tctx.drawImage(img, 0, 0);

          const data = tctx.getImageData(0, 0, img.width, img.height).data;
          const pts = [];

          for (let y = 0; y < img.height; y += SAMPLE_GAP) {
            for (let x = 0; x < img.width; x += SAMPLE_GAP) {
              if (data[(y * img.width + x) * 4 + 3] > 128) {
                pts.push({ x, y });
              }
            }
          }
          return pts;
        }

        function fitToArchiveStage(points) {
          let minX = Infinity,
            minY = Infinity;
          let maxX = -Infinity,
            maxY = -Infinity;

          points.forEach((p) => {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
          });

          const scale = Math.min(
            STAGE_SIZE / (maxX - minX),
            STAGE_SIZE / (maxY - minY),
            1,
          );

          const ox = rect.width / 2 - (minX + (maxX - minX) / 2) * scale;
          const oy = rect.height / 2 - (minY + (maxY - minY) / 2) * scale;

          return points.map((p) => ({
            x: p.x * scale + ox,
            y: p.y * scale + oy,
          }));
        }

        const img = archiveImageCache[currentArchiveIndex];

        // Fallback (safety)
        if (!img) {
          const fallback = new Image();
          fallback.src = imgSrc;
          fallback.onload = () => processArchiveImage(fallback);
          animateArchiveDots();
          return;
        }

        function processArchiveImage(image) {
          const targets = fitToArchiveStage(imageToPoints(image));
          archiveDots = Array.from({ length: targets.length }, () => ({
            x: rect.width / 2,
            y: rect.height / 2,
            tx: 0,
            ty: 0,
          }));

          archiveDots.forEach((d, i) => {
            d.tx = targets[i].x;
            d.ty = targets[i].y;
          });

          animateArchiveDots();
        }

        // to run immediately if already decoded
        if (img.complete) {
          processArchiveImage(img);
        } else {
          img.onload = () => processArchiveImage(img);
        }
      }

      function animateArchiveDots() {
        if (!archiveCtx) return;

        cancelAnimationFrame(archiveRAF);

        function loop() {
          archiveCtx.clearRect(0, 0, archiveCanvas.width, archiveCanvas.height);
          archiveCtx.fillStyle = "#fff";

          archiveDots.forEach((d) => {
            d.x += (d.tx - d.x) * archive.lerpSpeed;
            d.y += (d.ty - d.y) * archive.lerpSpeed;
            archiveCtx.beginPath();
            archiveCtx.arc(d.x, d.y, 1, 0, Math.PI * 2);
            archiveCtx.fill();
          });

          archiveRAF = requestAnimationFrame(loop);
        }

        loop();
      }

      function initEventAnimation(container) {
        const svg = container.querySelector("svg");
        const paths = svg.querySelectorAll("path");
        const dots = Array.from(svg.querySelectorAll(".dot")).map((el, i) => ({
          el,
          path: paths[i < 2 ? 0 : 1],
          t: i * 150,
          speed: 0.2 - i * 0.03,
        }));

        const overlap = svg.querySelector(".overlap");

        function animate() {
          const positions = [];

          dots.forEach((d) => {
            const len = d.path.getTotalLength();
            d.t = (d.t + d.speed) % len;
            const p = d.path.getPointAtLength(d.t);
            d.el.setAttribute("cx", p.x);
            d.el.setAttribute("cy", p.y);
            positions.push(p);
          });

          let found = false;
          for (let i = 0; i < positions.length; i++) {
            for (let j = i + 1; j < positions.length; j++) {
              const dx = positions[i].x - positions[j].x;
              const dy = positions[i].y - positions[j].y;
              if (Math.hypot(dx, dy) < 8) {
                overlap.setAttribute(
                  "cx",
                  (positions[i].x + positions[j].x) / 2,
                );
                overlap.setAttribute(
                  "cy",
                  (positions[i].y + positions[j].y) / 2,
                );
                overlap.setAttribute("r", 7);
                found = true;
                break;
              }
            }
            if (found) break;
          }

          if (!found) overlap.setAttribute("r", 0);
          requestAnimationFrame(animate);
        }

        animate();
      }

        let stepIndex = 0;

        let isDeleting = false;
        let currentContent = "";
        function loop() {
          if (!document.getElementById("home-title")) return;
          const fullString = textSteps[stepIndex];
          if (isDeleting) {
            if (currentContent.slice(-1) === ">") {
              let tagStart = currentContent.lastIndexOf("<");
              currentContent = currentContent.substring(0, tagStart);
            } else {
              currentContent = currentContent.slice(0, -1);

          } else {
            if (fullString.charAt(charIndex) === "<") {
              let tagEnd = fullString.indexOf(">", charIndex);
              currentContent += fullString.substring(charIndex, tagEnd + 1);
              charIndex = tagEnd + 1;
            } else {
              currentContent += fullString.charAt(charIndex);
              charIndex++;
            }
          }
          h1.innerHTML = currentContent + cursor;
          let speed = isDeleting
            ? UI_CONFIG.typing.homeDeleteSpeedMs
            : UI_CONFIG.typing.homeTypeSpeedMs;

          if (!isDeleting && charIndex >= fullString.length) {
            speed = 3500;
            isDeleting = true;
          } else if (isDeleting && currentContent === "") {
            isDeleting = false;
            stepIndex = (stepIndex + 1) % textSteps.length;
            charIndex = 0;
            speed = 1000;
          }
          setTimeout(loop, speed);
        }

      function activateSchrodingerGlitch() {
        const targets = document.querySelectorAll(".schrodinger-target");
        const glitchChars = "010101∅±∑√∫≈≠";

        targets.forEach((target) => {
          if (target.dataset.glitchBound === "1") return;
          target.dataset.glitchBound = "1";

          let hoverTimer = null;
          let glitchInterval = null;

          const triggerGlitch = () => {
            if (!target.innerText || target.innerText.trim().length === 0)
              return;

            const originalHTML = target.innerHTML;
            target.dataset.originalHTML = originalHTML;

            const roleSpan = target
              .closest(".content-panel")
              ?.querySelector(".role-anim");

            if (roleSpan) eraseRoleText(roleSpan);

            let iterations = 0;

            glitchInterval = setInterval(() => {
              let glitchText = "";
              for (let i = 0; i < target.innerText.length; i++) {
                glitchText +=
                  glitchChars[Math.floor(Math.random() * glitchChars.length)];
              }

              target.innerText = glitchText;
              iterations++;

              if (iterations > UI_CONFIG.glitch.iterations) {
                clearInterval(glitchInterval);
                glitchInterval = null;

                const resolveText = target.dataset.resolve;
                if (resolveText) {
                  target.innerText = resolveText.slice(
                    0,
                    target.innerText.length,
                  );
                } else {
                  target.innerHTML = originalHTML;
                }
              }
            }, UI_CONFIG.glitch.frameMs);

            updateStatusBar("QUANTUM_STATE_DECOHERENCE_DETECTED...");
            clearTimeout(window.statusTimeout);
            window.statusTimeout = setTimeout(resetStatus, 1000);
          };

          target.addEventListener("mouseenter", () => {
            hoverTimer = setTimeout(triggerGlitch, 2000);
          });

          // DESKTOP: delayed hover (2s)
          target.addEventListener("mouseenter", () => {
            hoverTimer = setTimeout(triggerGlitch, 2000);
          });

          target.addEventListener("mouseleave", () => {
            if (hoverTimer) {
              clearTimeout(hoverTimer);
              hoverTimer = null;
            }

            if (glitchInterval) {
              clearInterval(glitchInterval);
              glitchInterval = null;
              if (target.dataset.originalHTML) {
                target.innerHTML = target.dataset.originalHTML;
              }
            }
          });

          // MOBILE: immediate
          target.addEventListener("touchstart", triggerGlitch);
        });
      }

      window.addEventListener("scroll", () => {
        const currentScrollY = window.scrollY;
        const velocity = Math.abs(currentScrollY - lastScrollY);
        document.body.classList.remove("doppler-red", "doppler-blue");
        if (currentScrollY > lastScrollY) {
          document.body.classList.add("doppler-red");
          updateStatusBar(`DOPPLER_RED_SHIFT | VELOCITY: ${velocity}px/frame`);
        } else if (currentScrollY < lastScrollY) {
          document.body.classList.add("doppler-blue");
          updateStatusBar(`DOPPLER_BLUE_SHIFT | VELOCITY: ${velocity}px/frame`);
        }
        lastScrollY = currentScrollY;
        clearTimeout(window.statusTimeout);
        window.statusTimeout = setTimeout(resetStatus, 1000);
      });

      let keyBuffer = "";
      document.addEventListener("keydown", (e) => {
        keyBuffer += e.key.toLowerCase();
        if (keyBuffer.length > 10) keyBuffer = keyBuffer.slice(-10);

        const body = document.body;

        if (keyBuffer.endsWith("light")) {
          body.classList.remove("theme-blue", "theme-green");
          body.classList.toggle("inverted");
          updateStatusBar("POLARITY_INVERTED | LIGHT_MODE: ACTIVE");
          keyBuffer = "";
        }

        if (keyBuffer.endsWith("blue")) {
          body.classList.remove("inverted", "theme-green");
          body.classList.add("theme-blue");
          updateStatusBar("TERMINAL_THEME | BLUE_MODE: ACTIVE");
          keyBuffer = "";
        }

        if (keyBuffer.endsWith("green")) {
          body.classList.remove("inverted", "theme-blue");
          body.classList.add("theme-green");
          updateStatusBar("TERMINAL_THEME | GREEN_MODE: ACTIVE");
          keyBuffer = "";
        }

        setTimeout(resetStatus, 2000);
      });

      /* === MOBILE 4-TAP INVERSION (NON-INTRUSIVE) === */

      let tapCount = 0;
      let tapTimer = null;
      const { gestures } = UI_CONFIG;
      const TAP_WINDOW = gestures.tapWindowMs;
      // ms

      document.addEventListener(
        "touchend",
        () => {
          tapCount++;

          if (tapCount === 1) {
            tapTimer = setTimeout(() => {
              tapCount = 0;
            }, TAP_WINDOW);
          }

          if (tapCount === gestures.tapCountForInvert) {
            clearTimeout(tapTimer);
            tapCount = 0;

            document.body.classList.toggle("inverted");
            updateStatusBar("POLARITY_INVERTED | TOUCH_GESTURE: ACTIVE");
            setTimeout(resetStatus, 2000);
          }
        },
        { passive: true },
      );
    </script>
  </body>
</html>
